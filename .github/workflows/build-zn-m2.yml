name: Build ZN-M2 OpenWrt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'build.sh'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - '.github/workflows/build-zn-m2.yml'
  watch:
    types: [started]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build.sh
